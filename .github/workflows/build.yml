name: Build YadAvarMan

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          echo "Found: $ZIP_FILE"
          rm -rf project
          mkdir project
          unzip -o "$ZIP_FILE" -d project

      - name: Check project
        run: |
          cd project
          ls -la
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YadAvarMan-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
